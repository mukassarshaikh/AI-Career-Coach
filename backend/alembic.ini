# A generic, single database configuration.

[alembic]
script_location = alembic
prepend_sys_path = .
# version_path_separator = os  # Use os.pathsep. Default is to use ':'
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# The sqlalchemy.url is read from env.py (via app.core.config), not here.
# Leave this blank so Alembic never connects without the real URL.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
